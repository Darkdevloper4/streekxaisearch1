
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STREEKX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
            },
            colors: {
              streekx: {
                bg: '#000000',
                card: '#1c1c1e', 
                border: '#2c2c2e',
                primary: '#2563eb', 
                primaryDark: '#1d4ed8',
                text: '#ffffff',
                subtext: '#a1a1aa',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-right': 'slideRight 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideRight: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .dark body {
        background-color: #000000;
        color: #ffffff;
      }
      .light body {
        background-color: #ffffff;
        color: #000000;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Audio Wave Animation for Assistant Icon */
      @keyframes wave-1 {
        0%, 100% { height: 6px; }
        50% { height: 12px; }
      }
      @keyframes wave-2 {
        0%, 100% { height: 10px; }
        50% { height: 18px; }
      }
      @keyframes wave-3 {
        0%, 100% { height: 14px; }
        50% { height: 22px; }
      }
      .animate-wave-1 { animation: wave-1 1s infinite ease-in-out; }
      .animate-wave-2 { animation: wave-2 1.1s infinite ease-in-out; }
      .animate-wave-3 { animation: wave-3 1.2s infinite ease-in-out; }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
